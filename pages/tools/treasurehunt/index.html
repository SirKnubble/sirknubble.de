<!doctype html>
<html lang="en" oncontextmenu="return false;">
  <head>
    <!-- Main -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.5.1/dist/leaflet.css"
      integrity="sha512-xwE/Az9zrjBIphAcBb3F6JVqxf46+CDLwfLMHloNu6KEQCAWi6HcDUbeOfBIptF7tcCzusKFjFw2yuvEpDL9wQ=="
      crossorigin="anonymous"
    />
    <link href="css/styles.css" rel="stylesheet" />
    <!-- <link href="/old/styles.css" rel="stylesheet" /> -->
    <script
      src="https://unpkg.com/leaflet@1.5.1/dist/leaflet.js"
      integrity="sha512-GffPMF3RvMeYyc1LWMHtK8EbPv0iNZ8/oTtHPx9/cc2ILxQ+u905qIwdpULaqDkyBKgOaB57QTMg7ztg8Jm2Og=="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"
      crossorigin="anonymous"
    ></script>

    <link rel="icon" href="icons/favicon.ico" />
    <title>Treasure Hunt Map - sirknubble.dev</title>
  </head>

  <body>
    <!-- Map-Functions, Controls, Markers, Layers -->
    <div id="map" style="width: 100%; height: 100%; background-color: #0fa8d2">
      <!-- duplicate button in bottom-left for quick access -->
      <div
        class="gallery-button"
        onclick="location.href = 'gallery.html'"
        style="bottom: 20px; left: 10px; position: absolute; font-size: 18px"
      >
        <a
          ><img
            src="icons/left-chevron.png"
            alt="back"
            class="nav-icon"
          />&nbsp;Gallery</a
        >
      </div>
    </div>

    <script>
      //Initialize  Leaflet map
      var map = L.map("map", {
        crs: L.CRS.Simple,
        minZoom: -3,
        zoomSnap: 0.5,
        zoomDelta: 0.5,
        maxBoundsViscosity: 1.0,
      });
      var bounds = [
        [0, 0],
        [8192, 8192],
      ];
      map.attributionControl.addAttribution(
        'Original &copy; <a href= "https://github.com/jgardner117">Jesse Gardner</a> | GTA V &copy; <a href= "www.rockstargames.com">Rockstar Games</a>',
      );
      //Initialize each base layer
      var atlas = L.imageOverlay("images/gtav.png", bounds).addTo(map);
      var satellite = L.imageOverlay(
        "images/GTAV_SATELLITE_8192x8192.png",
        bounds,
      );
      var road = L.imageOverlay("images/GTAV_ROADMAP_8192x8192.png", bounds);
      map.fitBounds(bounds);
      map.setMaxBounds(bounds);

      // Load each layer from it's corresponding GeoJSON file
      var treasure = L.geoJson(null, {
        pointToLayer: function (feature, latlng) {
          //Create icon for marker
          var icn = L.icon({
            iconUrl: "icons/schatz.png",
            iconSize: [40, 40], // size of the icon
          });
          var marker = L.marker(latlng, {
            icon: icn,
            title: "Right-click to copy share link",
          });
          marker.bindPopup(
            "<font color=white><h4>" +
              feature.properties.name +
              "</h4>" +
              "<img src='" +
              feature.properties.imgname +
              "' class='popupImage'></font>",
          );
          // share on right-click
          marker.on("contextmenu", function () {
            var match = feature.properties.imgname.match(/(\d+)\.jpg$/);
            if (match) {
              var id = match[1];
              var share =
                window.location.origin +
                window.location.pathname +
                "?treasureId=" +
                id;
              navigator.clipboard.writeText(share).then(function () {
                alert("Share link copied to clipboard:\n" + share);
              });
            }
          });
          return marker;
        },
      });
      $.getJSON("geojson/treasure.json", function (data) {
        treasure.addData(data).addTo(map); // WICHTIG !!! .addTo(map), um des beim Start standardmäßig zu aktivieren.

        // Check if treasureId was passed from gallery
        const params = new URLSearchParams(window.location.search);
        const treasureId = params.get("treasureId");
        if (treasureId) {
          // Find and highlight the treasure
          let foundTreasure = null;
          data.features.forEach((feature, index) => {
            if (index + 1 === parseInt(treasureId)) {
              foundTreasure = feature;
            }
          });

          if (foundTreasure) {
            const coords = foundTreasure.geometry.coordinates;
            // Zoom to treasure location (very low zoom = wide view)
            map.setView([coords[1], coords[0]], 0.5);

            // Find and open the marker popup
            setTimeout(() => {
              treasure.eachLayer(function (layer) {
                if (
                  layer.feature &&
                  layer.feature.properties.imgname ===
                    foundTreasure.properties.imgname
                ) {
                  layer.openPopup();
                }
              });
            }, 500);

            // Remove treasureId from URL (optional, for cleaner history)
            window.history.replaceState(
              {},
              document.title,
              window.location.pathname,
            );
          }
        }
      });

      var sprayspots = L.geoJson(null, {
        pointToLayer: function (feature, latlng) {
          //Create icon for marker
          var icn = L.icon({
            iconUrl: "icons/spray-can-sparkles-solid.svg",
            iconSize: [35, 35], // size of the icon
          });
          var marker = L.marker(latlng, {
            icon: icn,
          });
          marker.bindPopup(
            "<font color=white><h4>" +
              feature.properties.name +
              "</h4>" +
              "<img src='" +
              feature.properties.imgname +
              "' class='popupImage'></font>",
          );
          return marker;
        },
      });
      $.getJSON("geojson/Spray Spots.json", function (data) {
        sprayspots.addData(data); // WICHTIG !!! .addTo(map), um des beim Start standardmäßig zu aktivieren.
      });

      // Load and display regions
      var regionsLayer = L.layerGroup();
      $.getJSON("geojson/regions.json", function (data) {
        data.regions.forEach(function (region) {
          if (region.bounds) {
            var rect = L.rectangle(
              [
                [region.bounds.minY, region.bounds.minX],
                [region.bounds.maxY, region.bounds.maxX],
              ],
              {
                color: "#0066cc",
                weight: 2,
                opacity: 0.6,
                fill: false,
              },
            );
            rect.bindPopup("<strong>" + region.name + "</strong>");
            regionsLayer.addLayer(rect);
          }
        });
      });

      //Create titles for each layer with mini icons to add to the Control
      var overlay = {
        "<img src='icons/schatz.png' align='center' width='30' height='30' /> Treasures":
          treasure,
        "<img src='icons/spray-can-sparkles-solid.svg' align='center' width='30' height='30'/> Soon...":
          sprayspots,
        Regions: regionsLayer,
      };

      //Create titles for each baselayer to add to the Control
      var baseLayers = {
        Atlas: atlas,
        Road: road,
        Satellite: satellite,
      };
      //Create Control layer and add to map
      var over = L.control
        .layers(baseLayers, overlay, {
          collapsed: false,
          sortLayers: true,
        })
        .addTo(map);

      //When the map's base layer is changed, change the color of the background
      //to match the map
      map.on("baselayerchange", function (layer) {
        if (layer.name == "Road") {
          document.getElementById("map").style.background = "#1862ad";
        }
        if (layer.name == "Satellite") {
          document.getElementById("map").style.background = "#143d6b";
        }
        if (layer.name == "Atlas") {
          document.getElementById("map").style.background = "#0fa8d2";
        }
      });

      const debug = new URLSearchParams(window.location.search).has("debug");
      if (debug) {
        const coordDiv = L.control({ position: "bottomleft" });

        coordDiv.onAdd = function () {
          this._div = L.DomUtil.create("div", "leaflet-debug-coords");
          this._div.style.background = "rgba(0,0,0,0.7)";
          this._div.style.color = "#fff";
          this._div.style.padding = "4px 8px";
          this._div.style.fontFamily = "monospace";
          return this._div;
        };

        coordDiv.addTo(map);

        map.on("mousemove", (e) => {
          coordDiv._div.innerText = `Lat: ${e.latlng.lat.toFixed(6)}\nLng: ${e.latlng.lng.toFixed(6)}`;
        });
      }
      if (debug) {
        map.on("click", (e) => {
          console.log(`L.marker([${e.latlng.lat}, ${e.latlng.lng}])`);
        });
      }
      if (debug) {
        map.on("click", (e) => {
          L.marker(e.latlng)
            .addTo(map)
            .bindPopup(
              `[${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}]`,
            )
            .openPopup();
        });
      }
    </script>
  </body>
</html>
